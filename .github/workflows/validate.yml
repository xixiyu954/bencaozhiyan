name: Validate site scripts

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cloud-ai.js
          node --check lab-data-extra.js
          node --check lab-data-v3.js
          node --check lab-tools-v3.js
          node --check lab-v4-spectroscopy.js
          node --check lab-v5-encyclopedia.js
          node --check lab-v6-pro.js
          node --check lab-v7-media-pro.js
          node --check lab-v8-studio.js
          node --check lab-v9-data.js
          node --check lab-v9-visuals.js
          node --check lab-v10-sandbox.js
          node --check lab-v11-userplan.js
          node --check lab-v12-diy-studio.js
          node --check lab-v13-mission-os.js
          node --check lab-v14-course-diagrams.js
          node --check lab-v15-insight.js
          node --check lab-v16-portal.js
          node --check lab-v17-ai-review.js
          node --check lab-v18-translation-data.js
          node --check lab-v18-translation.js
          node --input-type=module --check < functions/api/ai-proxy.js
      - name: Reject embedded provider secrets
        run: |
          ! grep -R -E "SHARED_QWEN_KEY|atob\(['\"]sk-|apiKey:[[:space:]]*['\"]sk-" --include='*.js' --include='*.html' .
