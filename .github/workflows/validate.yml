name: Build and Validate

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare Pages Functions syntax
        run: |
          node --check functions/api/ai-proxy.js
          node --check functions/api/drafts.js

      - name: Reject embedded provider secrets
        run: |
          ! grep -R -E "SHARED_QWEN_KEY|atob\(['\"]sk-|apiKey:[[:space:]]*['\"]sk-" \
            --include='*.js' --include='*.html' \
            --exclude-dir=node_modules --exclude-dir=dist .

      - name: Build Vite production bundle
        run: npm run build

      - name: Verify build output and lazy chunks
        run: |
          node -e "
            const fs = require('node:fs');
            const requiredFiles = [
              'dist/index.html',
              'dist/_headers',
              'dist/manifest.webmanifest',
              'dist/robots.txt',
              'dist/sitemap.xml'
            ];
            for (const f of requiredFiles) {
              if (!fs.existsSync(f)) throw new Error('Missing build artifact: ' + f);
            }
            const assets = fs.readdirSync('dist/assets');
            const requiredChunks = [
              'index-',
              'vendor-three-',
              'suite-vlab3d-',
              'suite-visuals-',
              'suite-knowledge-',
              'suite-explore-',
              'route-diy-',
              'route-translation-'
            ];
            for (const prefix of requiredChunks) {
              if (!assets.some((a) => a.startsWith(prefix))) {
                throw new Error('Missing expected chunk with prefix: ' + prefix);
              }
            }
            console.log('Verified', requiredFiles.length, 'root artifacts and', assets.length, 'bundled assets.');
          "
